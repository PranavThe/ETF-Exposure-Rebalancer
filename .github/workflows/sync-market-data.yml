name: Sync portfolio market data

on:
  workflow_dispatch:
  schedule:
    # After the U.S. market close, including during daylight saving time.
    - cron: "30 22 * * 1-5"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required secrets
        id: config
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        shell: bash
        run: |
          missing=()
          [[ -n "$DATABASE_URL" ]] || missing+=(DATABASE_URL)
          [[ -n "$ALPACA_API_KEY_ID" ]] || missing+=(ALPACA_API_KEY_ID)
          [[ -n "$ALPACA_API_SECRET_KEY" ]] || missing+=(ALPACA_API_SECRET_KEY)
          if ((${#missing[@]})); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Market-data sync skipped. Configure these GitHub Actions secrets: ${missing[*]}." >> "$GITHUB_STEP_SUMMARY"
            echo "Skipping market-data sync; missing GitHub Actions secrets: ${missing[*]}"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.configured == 'true'
      - uses: actions/setup-python@v5
        if: steps.config.outputs.configured == 'true'
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        if: steps.config.outputs.configured == 'true'
        run: python -m pip install -r requirements.txt
      - name: Refresh holdings and prices for saved portfolio funds
        if: steps.config.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python scripts/sync_market_data.py --portfolio-funds
