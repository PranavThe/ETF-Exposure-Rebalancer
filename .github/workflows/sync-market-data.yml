name: Sync portfolio market data

on:
  workflow_dispatch:
  schedule:
    # After the U.S. market close, including during daylight saving time.
    - cron: "30 22 * * 1-5"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
    steps:
      - name: Require production database configuration
        run: test -n "$DATABASE_URL"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh holdings and prices for saved portfolio funds
        run: python scripts/sync_market_data.py --portfolio-funds
